{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-primary text-white text-center">

<h2>

<i class="bi bi-person-circle me-2"></i>

Edit Profile

</h2>

</div>

<div class="card-body p-5">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">First Name</label>

<input type="text"
name="first_name"
class="form-control"
value="{{ patient[3] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Last Name</label>

<input type="text"
name="last_name"
class="form-control"
value="{{ patient[4] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Phone</label>

<input type="text"
name="phone"
class="form-control"
value="{{ patient[8] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Email</label>

<input type="email"
name="email"
class="form-control"
value="{{ patient[9] }}"
required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">Dzongkhag</label>

<input type="text"
name="dzongkhag"
class="form-control"
value="{{ patient[11] }}">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">Gewog</label>

<input type="text"
name="gewog"
class="form-control"
value="{{ patient[12] }}">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">Village</label>

<input type="text"
name="village"
class="form-control"
value="{{ patient[13] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Emergency Contact Name

</label>

<input type="text"
name="emergency_contact_name"
class="form-control"
value="{{ patient[15] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Emergency Contact Phone

</label>

<input type="text"
name="emergency_contact_phone"
class="form-control"
value="{{ patient[16] }}">

</div>

</div>

<div class="text-center mt-4">

<button class="btn btn-success btn-lg rounded-pill px-5">

<i class="bi bi-check-circle me-2"></i>

Update Profile

</button>

<a href="/patient/profile"
class="btn btn-secondary btn-lg rounded-pill px-5 ms-3">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
