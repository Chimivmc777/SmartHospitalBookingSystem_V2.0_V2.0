{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-warning text-white text-center">

<h2>

<i class="bi bi-key-fill me-2"></i>

Change Password

</h2>

</div>

<div class="card-body p-5">

<form method="POST">

<div class="mb-4">

<label class="form-label">

Current Password

</label>

<input
type="password"
name="current_password"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label">

New Password

</label>

<input
type="password"
name="new_password"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label">

Confirm New Password

</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-warning btn-lg rounded-pill px-5 text-white">

<i class="bi bi-shield-lock-fill me-2"></i>

Update Password

</button>

<a href="/patient/dashboard"
class="btn btn-secondary btn-lg rounded-pill px-5 ms-3">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
